[project]
name = "vibeflow-mcp"
version = "0.1.0"
description = "MCP server for the VibeFlow platform (vibeflow.fptconsulting.co.jp) using SSO-captured tokens"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.20",
    "httpx>=0.27",
    "playwright>=1.45",
]

[project.scripts]
vibeflow-mcp = "vibeflow_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibeflow_mcp"]
